name: Deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
          pnpm exec vite build --config desktop/vite.config.ts

      - name: Check out deployment storage
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: codex/web-assets
          path: .web-assets
          persist-credentials: false

      - name: Verify and unpack published web application
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          node scripts/web-release-storage.mjs verify .web-assets "$tag" "$commit"
          mkdir -p .pages/site
          unzip -q ".web-assets/releases/$tag/opticmesh-web-${tag#v}.zip" -d .pages/site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
