name: Windows release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build and attach assets to (empty builds the selected branch)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Validate release identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($rootVersion -ne $desktopVersion) { throw "Root and desktop versions differ" }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$($rootVersion -replace '-beta$', '')") { throw "Release tag does not match package version" }

      - name: Build desktop interface
        run: pnpm exec vite build --config desktop/vite.config.ts

      - name: Package Windows installer
        working-directory: desktop
        run: pnpm build --publish never

      - name: Install and launch-check Windows application
        shell: pwsh
        run: |
          $runtime = Start-Process -FilePath 'desktop/build/ndi-runtime/NDI 6 Runtime.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($runtime.ExitCode -notin @(0, 3010)) { throw "NDI Runtime installation failed" }
          $installer = @(Get-ChildItem desktop/release/*-Setup.exe)
          if ($installer.Count -ne 1) { throw "Expected one installer" }
          $destination = Join-Path $env:RUNNER_TEMP 'OpticMesh-installed'
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S',"/D=$destination" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "OpticMesh installation failed" }
          $qa = Join-Path $env:RUNNER_TEMP 'opticmesh-qa'
          npm install --prefix $qa --no-package-lock --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw "Unable to prepare UI verification" }
          $env:PLAYWRIGHT_MODULE = Join-Path $qa 'node_modules/playwright'
          $env:OPTICMESH_INSTALLED_APP = Join-Path $destination 'LO2S - OpticMesh.exe'
          node tests/desktop-release.browser.mjs
          if ($LASTEXITCODE -ne 0) { throw "Installed application verification failed" }

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version -replace '-beta$', ''
          $installers = @(Get-ChildItem desktop/release/*-Setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer" }
          $files = @($installers[0])
          $lines = $files | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          $lines | Set-Content -Encoding ascii desktop/release/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpticMesh-Windows
          path: |
            desktop/release/*-Setup.exe
            desktop/release/SHA256SUMS.txt

      - name: Attach files to draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw "Assets may only be attached to an existing draft release" }
          gh release upload $env:RELEASE_TAG desktop/release/*-Setup.exe desktop/release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
